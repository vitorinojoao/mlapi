## pg_hba.conf
## TYPE DATABASE        USER            ADDRESS                 METHOD

## 01 - REJECT connections from the superuser
host    all             postgres        all                     reject

## 02 - ALLOW connections from other roles
host    all             all             all                     scram-sha-256

## 03 - ALLOW local Unix socket connections (for Docker healthchecks)
local   all             postgres                                trust
