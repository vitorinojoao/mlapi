## pg_hba.conf

## TYPE DATABASE        USER            ADDRESS                 METHOD

## 01 - Unix socket connections within container - ALLOW
local   all             all                                     trust

## 02 - External connections to the superuser - REJECT
host    all             postgres        0.0.0.0/0               reject
host    all             postgres        ::/0                    reject

## 03 - External connections to other users - ALLOW WITH PASSWORD
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
