name: mlapi

networks:
  edge-network:
    driver: bridge
  internal-network:
    driver: bridge
    internal: true

volumes:
  nginx-volume:
  db-volume:

secrets:
  postgres_admin_password:
    file: ./docker-secrets/postgres_admin_password
  auth_db_password:
    file: ./docker-secrets/auth_db_password
  config_db_password:
    file: ./docker-secrets/config_db_password
  data_db_password:
    file: ./docker-secrets/data_db_password

services:
  ## Flask Application
  app-service:
    restart: unless-stopped
    build:
      context: ./mlapi-app
      args:
        - ARG_APP_PORT: "${ARG_APP_PORT:?Set APP_PORT in .env}"
        - ARG_APP_WORKERS: "${ARG_APP_WORKERS:-3}"
        - ARG_APP_TIMEOUT: "${ARG_APP_TIMEOUT:-30}"
        - ARG_APP_GRACEFUL: "${ARG_APP_GRACEFUL:-10}"
    environment:
      APP_CALL_URL_1: "${APP_CALL_URL_1:?Set APP_CALL_URL_1 in .env}"
      APP_CALL_URL_2: "${APP_CALL_URL_2:?Set APP_CALL_URL_2 in .env}"
      AUTH_DB_HOST: db
      AUTH_DB_NAME: auth
      AUTH_DB_USER: auth_app
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      CONFIG_DB_HOST: db
      CONFIG_DB_NAME: config
      CONFIG_DB_USER: config_app
      CONFIG_DB_PASSWORD_FILE: /run/secrets/config_db_password
      DATA_DB_HOST: db
      DATA_DB_NAME: data
      DATA_DB_USER: data_app
      DATA_DB_PASSWORD_FILE: /run/secrets/data_db_password
    secrets:
      - auth_db_password
      - config_db_password
      - data_db_password
    init: true
    networks: [edge-network, internal-network]
    expose: ["${ARG_APP_PORT:?Set APP_PORT in .env}"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=4m,mode=0755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  ## PostgreSQL Database
  db-service:
    restart: unless-stopped
    build: ./mlapi-db
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets:
      - postgres_admin_password
      - auth_db_password
      - config_db_password
      - data_db_password
    init: true
    networks: [internal-network]
    expose: ["5432"]
    read_only: true
    volumes:
      - db-volume:/var/lib/postgresql
    shm_size: 128mb
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run/postgresql:size=8m,mode=3775
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d postgres'
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  ## Nginx Reverse Proxy
  nginx-service:
    restart: unless-stopped
    build: ./mlapi-nginx
    environment:
      ARG_NGINX_DOMAIN: "${ARG_NGINX_DOMAIN:?Set ARG_NGINX_DOMAIN in .env}"
      ARG_APP_PORT: "${ARG_APP_PORT:?Set ARG_APP_PORT in .env}"
    init: true
    networks: [edge-network]
    ports:
      - "${ARG_NGINX_HTTP_PORT:-80}:80"
      - "${ARG_NGINX_HTTPS_PORT:-443}:443"
    read_only: true
    volumes:
      - nginx-volume:/etc/nginx/tls
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=16m,mode=0750
      - /var/run:size=2m,mode=0755
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      app-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
