name: mlapi

services:
  nginx:
    build: ./mlapi-nginx
    restart: unless-stopped
    init: true
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
    volumes:
      - tls-certs:/etc/nginx/tls
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /var/cache/nginx:size=16m,mode=0750
      - /var/run:size=2m,mode=0755
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  api:
    build: ./mlapi-flask
    restart: unless-stopped
    init: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      EXTERNAL_API_BASE_URL: "${EXTERNAL_API_BASE_URL:?Set external API URL}"
      AUTH_DB_HOST: db
      AUTH_DB_NAME: auth
      AUTH_DB_USER: auth_app
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      CONFIG_DB_HOST: db
      CONFIG_DB_NAME: config
      CONFIG_DB_USER: config_app
      CONFIG_DB_PASSWORD_FILE: /run/secrets/config_db_password
      DATA_DB_HOST: db
      DATA_DB_NAME: data
      DATA_DB_USER: data_app
      DATA_DB_PASSWORD_FILE: /run/secrets/data_db_password
    secrets:
      - auth_db_password
      - config_db_password
      - data_db_password
    expose: ["8000"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=4m,mode=0755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.00
    pids_limit: 100
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, database]

  db:
    build: ./mlapi-postgresql
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets:
      - postgres_admin_password
      - auth_db_password
      - config_db_password
      - data_db_password
    volumes:
      - pg-data:/var/lib/postgresql
    expose: ["5432"]
    shm_size: 128mb
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run/postgresql:size=8m,mode=3775
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.50
    pids_limit: 128
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d postgres'
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks: [database]

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  auth_db_password:
    file: ./secrets/auth_db_password
  config_db_password:
    file: ./secrets/config_db_password
  data_db_password:
    file: ./secrets/data_db_password

volumes:
  tls-certs:
  pg-data:

networks:
  edge:
    driver: bridge
  database:
    driver: bridge
    internal: true
