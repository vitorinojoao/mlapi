name: mlapi

## --------------------------
## 00 - Docker infrastructure
## --------------------------

## Note: INBOUND communication only allowed in 'proxy-service' via port mapping

networks:
  ## Edge network for [proxy -> app], [worker -> OUTBOUND] communication
  edge-network:
    driver: bridge
  ## Isolated network for [app -> worker], [app -> cache], [app -> db], [worker -> db] communication
  isolated-network:
    driver: bridge
    internal: true

volumes:
  ## Persistent volume for reverse proxy SSL/TLS certificates
  proxy-volume:
    driver: local
  ## Persistent volume for primary relational database
  db-volume:
    driver: local

secrets:
  ## Secret files for sensitive variables
  db_auth_password:
    file: ./docker-secrets/db_auth_password
  db_data_password:
    file: ./docker-secrets/db_data_password
  cache_password:
    file: ./docker-secrets/cache_password

services:
  ## ----------------------------------------
  ## 01 - Python Flask app with Gunicorn WSGI
  ## ----------------------------------------
  app-service:
    restart: unless-stopped
    build:
      context: ./01-mlapi-app
      args:
        APP_PORT: "${APP_PORT:?Set APP_PORT in .env}"
        ARG_APP_WORKERS: "${ARG_APP_WORKERS:-3}"
        ARG_APP_TIMEOUT: "${ARG_APP_TIMEOUT:-30}"
        ARG_APP_GRACEFUL: "${ARG_APP_GRACEFUL:-10}"
    environment:
      DB_HOST: db-service
      DB_PORT: "${DB_PORT:?Set DB_PORT in .env}"
      DB_TIMEOUT: 5
      DB_AUTH_NAME: "${DB_AUTH_NAME:?Set DB_AUTH_NAME in .env}"
      DB_AUTH_USER: "${DB_AUTH_USER:?Set DB_AUTH_USER in .env}"
      DB_AUTH_PASSWORD_FILE: /run/secrets/db_auth_password
      DB_DATA_NAME: "${DB_DATA_NAME:?Set DB_DATA_NAME in .env}"
      DB_DATA_USER: "${DB_DATA_USER:?Set DB_DATA_USER in .env}"
      DB_DATA_PASSWORD_FILE: /run/secrets/db_data_password
      API_CATEGORICAL_ENCODING_FILEPATH: "${API_CATEGORICAL_ENCODING_FILEPATH:?Set API_CATEGORICAL_ENCODING_FILEPATH in .env}"
      TRUSTED_HOSTS: ${DOMAIN:-api.home.arpa},${IP_ADDRESS:-127.0.0.1},localhost,127.0.0.1
      FLASK_SECRET_KEY_FILE: /run/secrets/flask_secret_key
      SECURITY_PASSWORD_SALT_FILE: /run/secrets/security_password_salt
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.invalid}
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/initial_admin_password
      SECURITY_TOKEN_TTL_SECONDS: ${SECURITY_TOKEN_TTL_SECONDS:-900}
      SECURITY_PASSWORD_LENGTH_MIN: ${SECURITY_PASSWORD_LENGTH_MIN:-14}
      SECURITY_PASSWORD_LENGTH_MAX: ${SECURITY_PASSWORD_LENGTH_MAX:-128}
      SECURITY_ZXCVBN_MINIMUM_SCORE: ${SECURITY_ZXCVBN_MINIMUM_SCORE:-3}
      AUTH_FAILURE_LOCKOUT_THRESHOLD: ${AUTH_FAILURE_LOCKOUT_THRESHOLD:-5}
      AUTH_FAILURE_LOCKOUT_SECONDS: ${AUTH_FAILURE_LOCKOUT_SECONDS:-900}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2000000}
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/cache_password
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_STRATEGY: ${RATE_LIMIT_STRATEGY:-moving-window}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-120 per minute}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-600 per minute}
      RATE_LIMIT_META: ${RATE_LIMIT_META:-10 per hour}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5 per minute}
      RATE_LIMIT_AUTH_MUTATIONS: ${RATE_LIMIT_AUTH_MUTATIONS:-20 per minute}
      RATE_LIMIT_CREDENTIAL_CHANGES: ${RATE_LIMIT_CREDENTIAL_CHANGES:-5 per hour}
      RATE_LIMIT_TASK_SUBMIT: ${RATE_LIMIT_TASK_SUBMIT:-10 per minute}
      RATE_LIMIT_READS: ${RATE_LIMIT_READS:-120 per minute}
      RATE_LIMIT_ADMIN_READS: ${RATE_LIMIT_ADMIN_READS:-30 per minute}
      RATE_LIMIT_ADMIN_MUTATIONS: ${RATE_LIMIT_ADMIN_MUTATIONS:-10 per minute}
      RATE_LIMIT_HEADERS_ENABLED: ${RATE_LIMIT_HEADERS_ENABLED:-false}
      RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:-secure-task-api}
    secrets:
      - db_auth_password
      - db_data_password
    init: true
    networks:
      - edge-network
      - isolated-network
    expose:
      - "${APP_PORT:?Set APP_PORT in .env}"
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run:size=16m,mode=0755
    read_only: true
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ 'CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)' ]
      start_period: 60s
      start_interval: 5s
      interval: 60s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    depends_on:
      workers-service:
        condition: service_healthy
      db-service:
        condition: service_healthy
      cache-service:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: "16m"
        max-file: "3"

  ## -----------------------------------------------------
  ## 02 - Python worker processes/threads with APScheduler
  ## -----------------------------------------------------
  workers-service:
    restart: unless-stopped
    build:
      context: ./02-mlapi-workers
    environment:
      DB_HOST: db-service
      DB_PORT: "${DB_PORT:?Set DB_PORT in .env}"
      DB_TIMEOUT: 5
      DB_DATA_NAME: "${DB_DATA_NAME:?Set DB_DATA_NAME in .env}"
      DB_DATA_USER: "${DB_DATA_USER:?Set DB_DATA_USER in .env}"
      DB_DATA_PASSWORD_FILE: /run/secrets/db_data_password
      WRKR_SCHEDULER_MAX_THREADS: 10
      WRKR_SCHEDULER_MAX_PROCESSES: 3
      WRKR_SCHEDULER_RESPAWN_PROCESSES: 100
      WRKR_TASKS_ORDER_LAST_IN_FIRST_OUT: true
      WRKR_TASKS_SUMMARY_HOURS: 24
      WRKR_TASKS_PENDING_TIME_TO_LIVE: 3600
      WRKR_TASKS_DONE_TIME_TO_LIVE: 172800
      WRKR_INPUT_DATA_TIME_TO_LIVE: 1
      WRKR_OUTPUT_RESULTS_TIME_TO_LIVE: 3600
      WRKR_MODEL_FILE: ./resources/slow_ml_model.joblib
      WRKR_MODEL_CLASS_NAMES_LIST: "[]"
      WRKR_SEND_EMAIL_LIST: "[ admin@example.com ]"
      WRKR_FETCH_URL_LIST: "[ https://example.com , http://192.0.2.1 ]"
    secrets:
      - db_data_password
    init: true
    networks:
      - edge-network
      - isolated-network
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run:size=8m,mode=0755
    read_only: true
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ 'CMD-SHELL', 'grep -q "run-workers.py" /proc/*/cmdline' ]
      start_period: 60s
      start_interval: 5s
      interval: 60s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    depends_on:
      db-service:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: "16m"
        max-file: "3"

  ## -------------------------------------------
  ## 03 - PostgreSQL primary relational database
  ## -------------------------------------------
  db-service:
    restart: unless-stopped
    build:
      context: ./03-mlapi-db
      args:
        DB_PORT: "${DB_PORT:?Set DB_PORT in .env}"
    environment:
      DB_AUTH_NAME: "${DB_AUTH_NAME:?Set DB_AUTH_NAME in .env}"
      DB_AUTH_USER: "${DB_AUTH_USER:?Set DB_AUTH_USER in .env}"
      DB_AUTH_PASSWORD_FILE: /run/secrets/db_auth_password
      DB_DATA_NAME: "${DB_DATA_NAME:?Set DB_DATA_NAME in .env}"
      DB_DATA_USER: "${DB_DATA_USER:?Set DB_DATA_USER in .env}"
      DB_DATA_PASSWORD_FILE: /run/secrets/db_data_password
    secrets:
      - db_auth_password
      - db_data_password
    ## Note: PostgreSQL needs init daemon to be disabled
    init: false
    networks:
      - isolated-network
    expose:
      - "${DB_PORT:?Set DB_PORT in .env}"
    ## Note: PostgreSQL may need larger shared memory
    shm_size: 1g
    volumes:
      - db-volume:/var/lib/postgresql
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run/postgresql:size=1m,mode=0775
    read_only: true
    cap_drop: [ ALL ]
    ## Note: PostgreSQL needs additional capabilities
    cap_add: [ CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER ]
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres -d postgres' ]
      start_period: 60s
      start_interval: 5s
      interval: 60s
      timeout: 5s
      retries: 5
    ## Note: PostgreSQL may need larger grace period
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "16m"
        max-file: "3"

  ## --------------------------------------
  ## 04 - Redis distributed in-memory cache
  ## --------------------------------------
  cache-service:
    restart: unless-stopped
    build:
      context: ./04-mlapi-cache
    environment:
      CACHE_PORT: "${CACHE_PORT:?Set CACHE_PORT in .env}"
      CACHE_PASSWORD_FILE: /run/secrets/cache_password
    secrets:
      - cache_password
    ## Note: Redis needs init daemon to be disabled
    init: false
    networks:
      - isolated-network
    expose:
      - "${CACHE_PORT:?Set CACHE_PORT in .env}"
    tmpfs:
      - /data:size=256m,mode=0700
      - /usr/local/etc/redis:size=1m,mode=0700
      - /run/redis:size=1m,mode=0755
    read_only: true
    cap_drop: [ ALL ]
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ 'CMD-SHELL', 'REDISCLI_AUTH="$$(cat /run/secrets/cache_password)" redis-cli ping | grep -q PONG' ]
      start_period: 60s
      start_interval: 5s
      interval: 60s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "16m"
        max-file: "3"

  ## ---------------------------------------------------
  ## 05 - Nginx SSL/TLS reverse proxy with rate limiting
  ## ---------------------------------------------------
  proxy-service:
    restart: unless-stopped
    build:
      context: ./05-mlapi-proxy
    environment:
      ARG_NGINX_DOMAIN: "${ARG_NGINX_DOMAIN:?Set ARG_NGINX_DOMAIN in .env}"
      ARG_NGINX_IP: "${ARG_NGINX_IP:?Set ARG_NGINX_IP in .env}"
      ARG_NGINX_BODY_SIZE: "10m"
      APP_PORT: "${APP_PORT:?Set APP_PORT in .env}"
      ARG_APP_SERVICE: "app-service"
    init: true
    ## Port mapping for [INBOUND -> proxy] communication
    ports:
      - "${ARG_NGINX_HTTP_PORT:-80}:80"
      - "${ARG_NGINX_HTTPS_PORT:-443}:443"
    networks:
      - edge-network
    volumes:
      - proxy-volume:/etc/nginx/tls
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /var/cache/nginx:size=64m,mode=0750
      - /etc/nginx/conf.d:size=1m,mode=0700
      - /run:size=1m,mode=0755
    read_only: true
    cap_drop: [ ALL ]
    ## Note: Nginx needs additional capabilities
    cap_add: [ CHOWN, SETUID, SETGID, NET_BIND_SERVICE ]
    security_opt: [ no-new-privileges:true ]
    healthcheck:
      test: [ 'CMD', 'nginx', '-t' ]
      start_period: 60s
      start_interval: 5s
      interval: 60s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
    depends_on:
      app-service:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: "16m"
        max-file: "3"
